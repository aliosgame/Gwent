plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'gwent'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
    modularity.inferModulePath = true
}

base {
    archivesName = 'gwent'
}

application {
    mainModule = 'gwent'
    mainClass = 'gwent.launch.GwentApp'
    applicationDefaultJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '--enable-native-access=javafx.graphics,javafx.media'
    ]
}

javafx {
    version = '25.0.5'
    modules = ['javafx.controls', 'javafx.media']
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '--enable-native-access=javafx.graphics,javafx.media'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED'
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Собрать исполняемый Fat JAR со всеми зависимостями и ресурсами.'
    archiveClassifier = 'all'

    manifest {
        attributes(
                'Main-Class': 'gwent.launch.GwentLauncher',
                'Implementation-Title': 'Gwent',
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output

    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
}
