plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.github.aliosgame'
version = '1.0'

def runJvmArgs = [
        '--enable-native-access=javafx.graphics,javafx.media',
        '-Dfile.encoding=UTF-8'
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.5'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

application {
    mainClass = 'alios.gwent.AppLauncher'
    applicationDefaultJvmArgs = runJvmArgs
}

tasks.named('run') {
    jvmArgs = runJvmArgs
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'ch.qos.logback:logback-classic:1.6.3'

    testImplementation platform('org.junit:junit-bom:5.11.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs = [
        '--enable-native-access=ALL-UNNAMED',
        '-Dfile.encoding=UTF-8'
    ]
    systemProperty 'gwent.workdir', layout.buildDirectory.dir('test-workdir').get().asFile.absolutePath
}
